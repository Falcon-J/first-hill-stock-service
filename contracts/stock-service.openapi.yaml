      operationId: releaseReservation
      summary: Release only this owner/order hold; restore unpaid confirmed allocation once.
      parameters:
      - in: header
        name: X-Request-ID
        required: true
        description: Correlation ID; preserved end-to-end in request_id.
        schema:
          type: string
          minLength: 1
      - in: header
