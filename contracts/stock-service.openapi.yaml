components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LineItem:
      type: object
      additionalProperties: false
      properties:
        line_item_number:
          type: integer
          minimum: 1
        drink_name:
          type: string
          minLength: 1
        size:
          type: string
          minLength: 1
        milk:
          type: string
          minLength: 1
        add_ins:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        quantity:
          type: integer
          minimum: 1
      required:
      - line_item_number
      - drink_name
      - size
      - milk
      - add_ins
      - quantity
    Basket:
      type: object
      additionalProperties: false
      properties:
        store_id:
          type: string
          minLength: 1
          description: Opaque inventory-owned string/explicit alias; no guessed normalization.
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
          minItems: 1
        submitted_at:
          type: string
          format: date-time
      required:
      - store_id
      - items
    FailureDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          enum: &id001
          - STORE_CLOSED
          - BASE_OUT_OF_STOCK
          - ADD_IN_OUT_OF_STOCK
          - INSUFFICIENT_QUANTITY
          - STOCK_CHANGED
          - RESERVATION_EXPIRED
          - STORE_NOT_FOUND
          - UNKNOWN_ITEM
          - INVALID_ORDER
          - IDEMPOTENCY_CONFLICT
          - INVALID_RESERVATION_STATE
          - RESERVATION_NOT_FOUND
          - PAYMENT_DECLINED
          - STOCK_CHECK_UNAVAILABLE
          - UPSTREAM_UNAVAILABLE
          - DEADLINE_EXCEEDED
          - UNAUTHORIZED
          - FORBIDDEN
        line_item_number:
          type:
          - integer
          - 'null'
          minimum: 1
        missing_component:
          type:
          - string
          - 'null'
      required:
      - code
      - line_item_number
      - missing_component
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          enum: *id001
        message:
          type: string
          minLength: 1
          description: Product-owned, human-readable text; examples are fixtures, not fixed
            copy.
        line_item_number:
          type:
          - integer
          - 'null'
          minimum: 1
        missing_component:
          type:
          - string
          - 'null'
        details:
          type: array
          items:
            $ref: '#/components/schemas/FailureDetail'
          minItems: 0
        retryable:
          type: boolean
      required:
      - code
      - message
      - line_item_number
      - missing_component
      - details
      - retryable
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
          minLength: 1
      required:
      - error
      - request_id
    OrderRequest:
      type: object
      additionalProperties: false
      properties:
        store_id:
          type: string
          minLength: 1
          description: Opaque inventory-owned string/explicit alias; no guessed normalization.
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
          minItems: 1
        submitted_at:
          type: string
          format: date-time
        payment_method_token:
          type: string
          minLength: 1
          description: Opaque payment token; never sent to stock or logged.
        availability_token:
          type: string
          minLength: 1
          description: Optional opaque inventory-issued menu decision token. It is not a hold;
            inventory validates binding/expiry and still checks current stock.
      required:
      - store_id
      - items
      - payment_method_token
    AcceptedOrder:
      type: object
      additionalProperties: false
      properties:
        status:
          const: accepted
          type: string
        order_id:
          type: string
          minLength: 1
        store_id:
          type: string
          minLength: 1
        queue_spot:
          type: integer
          minimum: 1
        request_id:
          type: string
          minLength: 1
      required:
      - status
      - order_id
      - store_id
      - queue_spot
      - request_id
    PendingOrder:
      type: object
      additionalProperties: false
      properties:
        status:
          const: pending
          type: string
        order_id:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
          enum:
          - ORDER_PENDING
          - PAYMENT_PENDING
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
      required:
      - status
      - order_id
      - code
      - message
      - request_id
    OrderResult:
      oneOf:
      - $ref: '#/components/schemas/AcceptedOrder'
      - $ref: '#/components/schemas/PendingOrder'
    Reservation:
      type: object
      additionalProperties: false
      properties:
        reservation_id:
          type: string
          minLength: 1
        order_id:
          type: string
          minLength: 1
        store_id:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
          enum:
          - reserved
          - confirmed
          - released
          - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
          minItems: 1
      required:
      - reservation_id
      - order_id
      - store_id
      - status
      - created_at
      - expires_at
      - allocations
    Allocation:
      type: object
      additionalProperties: false
      properties:
        component_id:
          type: string
          minLength: 1
        units:
          type: integer
          minimum: 1
        line_item_numbers:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
      required:
      - component_id
      - units
      - line_item_numbers
    ReserveRequest:
      type: object
      additionalProperties: false
      properties:
        order_id:
          type: string
          minLength: 1
        basket:
          $ref: '#/components/schemas/Basket'
        availability_token:
          type: string
          minLength: 1
          description: Optional inventory-issued evidence of an earlier available menu decision,
            bound to store and basket. Never a client availability claim or permission to reserve.
      required:
      - order_id
      - basket
    AvailabilityResult:
      type: object
      additionalProperties: false
      properties:
        store_id:
          type: string
          minLength: 1
        available:
          type: boolean
        checked_at:
          type: string
          format: date-time
        failures:
          type: array
          items:
            $ref: '#/components/schemas/FailureDetail'
          minItems: 0
        availability_token:
          type: string
          minLength: 1
          description: Opaque, signed/unguessable, store/basket-bound inventory decision token;
            expires after 120s and reserves nothing.
      required:
      - store_id
      - available
      - checked_at
      - failures
      allOf:
      - if:
          properties:
            available:
              const: false
        then:
          properties:
            failures:
              minItems: 1
      - if:
          properties:
            available:
              const: true
        then:
          required:
          - availability_token
          properties:
            failures:
              maxItems: 0
    StockChangedEnvelope:
      description: Required variant when a previously available basket loses stock at checkout
        or final confirmation. Select using authoritative inventory state, never client claims.
      allOf:
      - $ref: '#/components/schemas/ErrorEnvelope'
      - type: object
        properties:
          error:
            type: object
            properties:
              code:
                const: STOCK_CHANGED
              retryable:
                const: false
              line_item_number:
                type: integer
                minimum: 1
              missing_component:
                type: string
                minLength: 1
              details:
                type: array
                minItems: 1
                prefixItems:
                - type: object
                  properties:
                    code:
                      const: STOCK_CHANGED
                    line_item_number:
                      type: integer
                      minimum: 1
                    missing_component:
                      type: string
                      minLength: 1
                items:
                  $ref: '#/components/schemas/FailureDetail'
    OtherBusinessRefusalEnvelope:
      allOf:
      - $ref: '#/components/schemas/ErrorEnvelope'
      - type: object
        properties:
          error:
            type: object
            properties:
              code:
                enum:
                - STORE_CLOSED
                - BASE_OUT_OF_STOCK
                - ADD_IN_OUT_OF_STOCK
                - INSUFFICIENT_QUANTITY
                - RESERVATION_EXPIRED
                - IDEMPOTENCY_CONFLICT
                - INVALID_RESERVATION_STATE
              retryable:
                const: false
    BusinessRefusalEnvelope:
      oneOf:
      - $ref: '#/components/schemas/StockChangedEnvelope'
      - $ref: '#/components/schemas/OtherBusinessRefusalEnvelope'
x-reservation-lifecycle:
  initial: reserved
  terminal:
  - confirmed
  - released
  - expired
  ttl_seconds: 120
  expiry_boundary: now >= expires_at
  confirmation: Recheck current store_open and physical stock under inventory transaction, then
    consume own quantities exactly once.
  release: Owner-only. No restoration after successful capture; unknown capture outcome retains
    confirmed allocation for reconciliation.
  idempotency_retention_seconds: 86400
  renewal: false
x-data-owner: store-stock-service
x-errors: 'Primary failure: store-wide first, then lowest line number and lexical component
  ID. Include all failures in sorted details.'
x-menu-decision-token: An earlier available menu decision may be conveyed by an optional stock-issued
  token, bound to the canonical store/basket and valid for 120s. If validated and the reserve
  now loses stock, return STOCK_CHANGED. Without prior available evidence, a zero component
  uses its base/add-in code. Tokens never bypass the current check, and expired tokens cannot
  authorize a hold.
