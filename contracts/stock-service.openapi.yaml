openapi: 3.1.1
info:
  title: Store stock service
  version: 1.0.0-draft
  description: Sole owner of quantity_on_hand, reserved_quantity, store_open, recipes and all
    fulfilability decisions. No caller DB credentials/replicas or authoritative caches. POS/feed
    changes participate in final confirmation. All mutations are atomic and idempotent.
servers:
- url: http://localhost
  description: Development only; production service addresses are deployment configuration.
security:
- bearerAuth: []
paths:
  /v1/availability:
    post:
      operationId: checkAvailability
      summary: Advisory basket availability; no promise or stock mutation.
      parameters:
      - in: header
        name: X-Request-ID
        required: true
        description: Correlation ID; preserved end-to-end in request_id.
        schema:
          type: string
          minLength: 1
      - in: header
        name: X-Request-Deadline
        required: true
        description: Trusted gateway absolute deadline. Never extend it on retry.
        schema:
          type: string
          format: date-time
      responses:
        '401':
          description: Authentication missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthorized:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Unable to complete this request.
                      line_item_number: null
                      missing_component: null
                      details: []
                      retryable: false
                    request_id: req-contract-1
        '403':
          description: Caller cannot access this order/reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                forbidden:
                  value:
                    error:
                      code: FORBIDDEN
                      message: Unable to complete this request.
                      line_item_number: null
                      missing_component: null
                      details: []
                      retryable: false
                    request_id: req-contract-1
        '404':
          description: Unknown store, reservation or order; never fabricated stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknown_store:
                  value:
                    error:
                      code: STORE_NOT_FOUND
                      message: Unable to complete this request.
                      line_item_number: null
                      missing_component: null
                      details: []
                      retryable: false
                    request_id: req-contract-1
        '409':
          description: Nonretryable business refusal/conflict. No stock refusal after payment
            capture. A verified menu-available basket that loses stock at checkout/confirmation
            MUST use StockChangedEnvelope, not another 409 variant. Other variants apply only
            to their own conditions. Tests supply authoritative race state and enforce variant
            selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessRefusalEnvelope'
              examples:
                store_closed:
                  value:
                    error:
                      code: STORE_CLOSED
                      message: Bellevue Square is closed right now and can't take mobile orders.
                      line_item_number: null
                      missing_component: store_closed
                      details:
                      - code: STORE_CLOSED
                        line_item_number: null
                        missing_component: store_closed
                      retryable: false
                    request_id: req-MO-250303-0001
                base_out_of_stock:
                  value:
                    error:
                      code: BASE_OUT_OF_STOCK
                      message: 'Line 1, Grande Caffè Latte: Almondmilk is unavailable at this
                        store right now.'
                      line_item_number: 1
                      missing_component: Almondmilk
                      details:
                      - code: BASE_OUT_OF_STOCK
                        line_item_number: 1
                        missing_component: Almondmilk
                      retryable: false
                    request_id: req-MO-250304-0007
                add_in_out_of_stock:
                  value:
                    error:
                      code: ADD_IN_OUT_OF_STOCK
                      message: 'Line 1, Venti Cold Brew: Vanilla Sweet Cream Cold Foam is unavailable
                        at this store right now.'
                      line_item_number: 1
                      missing_component: Vanilla Sweet Cream Cold Foam
                      details:
                      - code: ADD_IN_OUT_OF_STOCK
                        line_item_number: 1
                        missing_component: Vanilla Sweet Cream Cold Foam
                      retryable: false
                    request_id: req-MO-250305-0014
                stock_runs_out_mid_order:
                  value:
                    error:
                      code: STOCK_CHANGED
                      message: 'Line 1, Grande Iced Brown Sugar Oatmilk Shaken Espresso: Oatmilk
                        is unavailable at this store right now.'
                      line_item_number: 1
                      missing_component: Oatmilk
                      details:
                      - code: STOCK_CHANGED
                        line_item_number: 1
                        missing_component: Oatmilk
                      retryable: false
                    request_id: req-MO-250307-0024
                insufficient_quantity:
                  value:
                    error:
                      code: INSUFFICIENT_QUANTITY
                      message: 'Line 1, Grande Iced Brown Sugar Oatmilk Shaken Espresso: Brown
                        Sugar Syrup is unavailable at this store right now.'
                      line_item_number: 1
                      missing_component: Brown Sugar Syrup
                      details:
                      - code: INSUFFICIENT_QUANTITY
                        line_item_number: 1
                        missing_component: Brown Sugar Syrup
                      retryable: false
                    request_id: req-MO-250307-0028
        '422':
          description: Invalid basket or unknown catalogue item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknown_item:
                  value:
                    error:
                      code: UNKNOWN_ITEM
                      message: Unable to complete this request.
                      line_item_number: 1
                      missing_component: Unknown ingredient
                      details:
                      - code: UNKNOWN_ITEM
                        line_item_number: 1
                        missing_component: Unknown ingredient
                      retryable: false
                    request_id: req-contract-1
        '503':
          description: Pre-payment dependency failure, not a sold-out business refusal. Retry
            original key only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                dependency:
                  value:
                    error:
                      code: STOCK_CHECK_UNAVAILABLE
                      message: Unable to complete this request.
                      line_item_number: null
                      missing_component: null
                      details: []
                      retryable: true
                    request_id: req-contract-1
        '200':
          description: Inventory-owned line decisions; no raw-count reasoning by callers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Basket'
