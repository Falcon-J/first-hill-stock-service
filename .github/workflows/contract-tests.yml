name: Service contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install -r requirements-contracts.txt
      - name: Run real contract assertions (red until providers exist)
        run: python -m pytest tests/contracts -q --junitxml=contract-results.xml
      - name: Publish contract results even when assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-results
          path: contract-results.xml
          if-no-files-found: error
