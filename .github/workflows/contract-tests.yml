name: Service contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install -r requirements-contracts.txt
      - name: Run frozen provider contracts
        run: python -m pytest tests/contracts -q --junitxml=contract-results.xml
      - name: Run service and guardrail regression tests
        run: python -m pytest tests -q
      - name: Lint
        run: python -m ruff check .
      - name: Start all three containers
        run: |
          python scripts/init_demo_env.py
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Observe real gateway refusal
        run: python scripts/demo_gateway.py --output gateway-demo.json
      - name: Record container HTTP calls
        if: always()
        run: docker compose logs --no-color > compose-calls.log
      - name: Stop CI containers
        if: always()
        run: docker compose down
      - name: Publish contract results even when assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-results
          path: contract-results.xml
          if-no-files-found: error
      - name: Publish live HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-gateway-evidence
          path: |
            gateway-demo.json
            compose-calls.log
