name: Final holdout replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  final-holdout-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fresh run evidence
        run: |
          mkdir final-replay-results
          echo '{"state":"not_started","completed_baskets":0}' > final-replay-results/run.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-contracts.txt
      - name: Run frozen contracts and source-input tests
        run: python -m pytest tests/contracts tests/test_final_replay_inputs.py tests/test_final_replay_oracle.py -q
      - name: Build all three services from nothing
        run: |
          python scripts/init_demo_env.py
          docker compose -p first-hill-final-replay -f compose.final-replay.yaml down --volumes --remove-orphans
          docker compose -p first-hill-final-replay -f compose.final-replay.yaml build --no-cache
          docker compose -p first-hill-final-replay -f compose.final-replay.yaml up --detach --wait --wait-timeout 180
          docker compose -p first-hill-final-replay -f compose.final-replay.yaml ps --format json > final-replay-results/containers.jsonl
      - name: Strict replay of all 40 held-out lines through gateway
        run: python checks/final_replay.py
      - name: Collect service calls
        if: always()
        run: docker compose -p first-hill-final-replay -f compose.final-replay.yaml logs --no-color > final-replay-results/compose-calls.log
      - name: Publish actual results even on mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-holdout-results
          path: final-replay-results/
          if-no-files-found: error
      - name: Remove this isolated test stack
        if: always()
        run: docker compose -p first-hill-final-replay -f compose.final-replay.yaml down --volumes
